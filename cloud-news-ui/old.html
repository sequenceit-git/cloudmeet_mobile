<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud News (云讯) - Mobile UI Prototype</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
        }
    </style>
</head>

<body class="bg-[#050B14] text-slate-100 min-h-screen p-4 md:p-10 flex flex-col items-center justify-center">

    <!-- Desktop Presentation Controls -->
    <div
        class="mb-8 flex items-center gap-4 bg-white/5 border border-white/10 px-5 py-2.5 rounded-full backdrop-blur-md">
        <span class="text-xs tracking-wider text-slate-400 uppercase font-semibold">Global Language Toggle:</span>
        <button onclick="switchLang('en')" id="btn-en"
            class="px-3 py-1 rounded-full text-xs font-semibold bg-sky-500 text-white transition">English</button>
        <button onclick="switchLang('zh')" id="btn-zh"
            class="px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition">中文</button>
    </div>

    <!-- Mobile Frames Showcase Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 w-full max-w-5xl justify-items-center">

        <!-- ========================================== -->
        <!-- SCREEN 1: ONBOARDING SCREEN -->
        <!-- ========================================== -->
        <div
            class="w-[380px] h-[780px] bg-gradient-to-b from-[#0F223D] via-[#091527] to-[#040912] rounded-[48px] border-[6px] border-slate-800 shadow-[0_25px_60px_-15px_rgba(0,168,255,0.2)] relative overflow-hidden flex flex-col justify-between p-6">

            <!-- Top Ambient Glow -->
            <div
                class="absolute -top-24 left-1/2 -translate-x-1/2 w-64 h-64 bg-sky-500/20 rounded-full blur-3xl pointer-events-none">
            </div>

            <!-- Header: Status Bar & Language Switcher -->
            <div class="relative z-10">
                <div class="flex justify-between items-center text-xs text-slate-400 mb-4 px-2">
                    <span class="font-semibold text-slate-300">09:41</span>
                    <div class="flex items-center gap-2">
                        <i data-lucide="signal" class="w-3.5 h-3.5"></i>
                        <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
                        <i data-lucide="battery-medium" class="w-4 h-4"></i>
                    </div>
                </div>

                <!-- Visible Top-Right Language Switcher -->
                <div class="flex justify-end">
                    <div
                        class="inline-flex p-1 bg-white/10 backdrop-blur-md rounded-full border border-white/10 text-xs">
                        <button onclick="switchLang('en')"
                            class="lang-btn-en px-2.5 py-0.5 rounded-full font-medium transition bg-sky-500 text-white">EN</button>
                        <button onclick="switchLang('zh')"
                            class="lang-btn-zh px-2.5 py-0.5 rounded-full font-medium text-slate-300 transition">中文</button>
                    </div>
                </div>
            </div>

            <!-- Center Logo & Branding -->
            <div class="relative z-10 flex flex-col items-center text-center my-auto">
                <!-- Glassmorphic Glowing Logo Card -->
                <div class="relative group">
                    <div
                        class="absolute -inset-1 bg-gradient-to-r from-sky-500 to-blue-600 rounded-3xl blur-xl opacity-60">
                    </div>
                    <div
                        class="relative w-28 h-28 bg-gradient-to-tr from-[#0F2D54] to-[#1E4E8C] rounded-3xl p-4 flex items-center justify-center border border-sky-400/30 shadow-inner">
                        <!-- Stylized Cloud / Yun (云) Emblem -->
                        <div class="relative flex items-center justify-center">
                            <i data-lucide="cloud" class="w-16 h-16 text-sky-400 fill-sky-400/40"></i>
                            <span
                                class="absolute text-xl font-black text-white tracking-tighter drop-shadow-md">云</span>
                        </div>
                    </div>
                </div>

                <h1 class="mt-6 text-3xl font-bold tracking-tight text-white flex items-center gap-2">
                    <span class="app-title">Cloud News</span>
                </h1>
                <p class="app-tagline text-sm text-sky-200/70 mt-2 max-w-[240px]">
                    Frictionless, secure video meetings without boundaries.
                </p>
            </div>

            <!-- Action Buttons Area -->
            <div class="relative z-10 space-y-3 pb-2">
                <!-- Join a Meeting (Primary Action - No Login Needed) -->
                <button
                    class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-sky-400 via-sky-500 to-blue-600 hover:from-sky-300 hover:to-blue-500 text-white font-semibold text-base shadow-lg shadow-sky-500/25 active:scale-[0.98] transition flex items-center justify-center gap-2">
                    <i data-lucide="video" class="w-5 h-5"></i>
                    <span class="txt-join-btn">Join a Meeting</span>
                </button>

                <!-- Sign In (Opens Sheet) -->
                <button onclick="toggleSignInModal(true)"
                    class="w-full py-3.5 px-6 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/15 text-slate-200 font-medium text-sm backdrop-blur-md active:scale-[0.98] transition flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4 text-sky-400"></i>
                    <span class="txt-signin-btn">Sign In</span>
                </button>

                <p class="text-[11px] text-center text-slate-500 pt-2">
                    <span class="txt-no-account">No account required to join standard meetings.</span>
                </p>
            </div>

            <!-- Sign In Bottom Sheet Modal -->
            <div id="signin-modal"
                class="absolute inset-x-0 bottom-0 bg-[#0B1728]/95 backdrop-blur-2xl p-6 rounded-t-[36px] border-t border-white/15 shadow-2xl transform translate-y-full transition-transform duration-300 z-30">
                <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-4"></div>
                <div class="flex justify-between items-center mb-5">
                    <h3 class="txt-signin-title text-lg font-bold text-white">Sign In to Cloud News</h3>
                    <button onclick="toggleSignInModal(false)"
                        class="p-1 rounded-full hover:bg-white/10 text-slate-400">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="space-y-3.5">
                    <div>
                        <label class="txt-username-label block text-xs font-medium text-slate-300 mb-1">Username /
                            ID</label>
                        <input type="text" placeholder="e.g. ismail@codenext"
                            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-sky-400 transition">
                    </div>
                    <div>
                        <label class="txt-password-label block text-xs font-medium text-slate-300 mb-1">Password</label>
                        <input type="password" placeholder="••••••••"
                            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-sky-400 transition">
                    </div>
                    <button
                        class="w-full mt-2 py-3.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-white font-semibold text-sm shadow-md shadow-sky-500/30 transition">
                        <span class="txt-submit-btn">Continue</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- SCREEN 2: HOME / DASHBOARD SCREEN -->
        <!-- ========================================== -->
        <div
            class="w-[380px] h-[780px] bg-gradient-to-b from-[#0F223D] via-[#091527] to-[#040912] rounded-[48px] border-[6px] border-slate-800 shadow-[0_25px_60px_-15px_rgba(0,168,255,0.2)] relative overflow-hidden flex flex-col justify-between p-6">

            <!-- Top Ambient Glow -->
            <div class="absolute -top-28 right-0 w-64 h-64 bg-blue-600/15 rounded-full blur-3xl pointer-events-none">
            </div>

            <!-- Header -->
            <div class="relative z-10">
                <!-- Status Bar -->
                <div class="flex justify-between items-center text-xs text-slate-400 mb-4 px-2">
                    <span class="font-semibold text-slate-300">09:41</span>
                    <div class="flex items-center gap-2">
                        <i data-lucide="signal" class="w-3.5 h-3.5"></i>
                        <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
                        <i data-lucide="battery-medium" class="w-4 h-4"></i>
                    </div>
                </div>

                <!-- Top Profile & Actions Bar -->
                <div class="flex items-center justify-between mt-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-400 to-blue-600 p-0.5 shadow-md">
                            <div
                                class="w-full h-full bg-[#0B1728] rounded-[14px] flex items-center justify-center font-bold text-sky-400 text-sm">
                                CN
                            </div>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 txt-welcome">Personal Workspace</p>
                            <h2 class="text-sm font-bold text-white app-title">Cloud News</h2>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button
                            class="p-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-slate-300">
                            <i data-lucide="bell" class="w-4 h-4"></i>
                        </button>
                        <button
                            class="p-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-slate-300">
                            <i data-lucide="settings" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Core Content Area (Webex Inspired) -->
            <div class="relative z-10 flex-1 my-5 flex flex-col gap-4 overflow-y-auto pr-0.5">

                <!-- Big Quick Action Cards (Webex Style) -->
                <div class="grid grid-cols-2 gap-3">
                    <!-- Start Meeting Card -->
                    <button
                        class="flex flex-col items-center justify-center p-5 rounded-3xl bg-gradient-to-br from-sky-500/20 to-blue-600/10 border border-sky-500/30 hover:border-sky-400 transition active:scale-[0.98] group text-center">
                        <div
                            class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-400 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/30 group-hover:scale-105 transition">
                            <i data-lucide="video" class="w-6 h-6"></i>
                        </div>
                        <span class="txt-start-meeting mt-3 text-sm font-bold text-white">Start Meeting</span>
                        <span class="txt-instant-sub text-[11px] text-sky-300/70">Instant Room</span>
                    </button>

                    <!-- Join Meeting Card -->
                    <button
                        class="flex flex-col items-center justify-center p-5 rounded-3xl bg-white/5 border border-white/10 hover:border-white/20 transition active:scale-[0.98] group text-center">
                        <div
                            class="w-12 h-12 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center text-sky-400 group-hover:scale-105 transition">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </div>
                        <span class="txt-join-meeting mt-3 text-sm font-bold text-white">Join Meeting</span>
                        <span class="txt-enter-id text-[11px] text-slate-400">Via Link or ID</span>
                    </button>
                </div>

                <!-- Personal Room Card (Webex Room Link Feature) -->
                <div class="p-4 rounded-3xl bg-white/[0.04] border border-white/10 backdrop-blur-xl">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <i data-lucide="shield-check" class="w-4 h-4 text-sky-400"></i>
                            <span class="txt-personal-room text-xs font-semibold text-slate-200">Personal Meeting
                                Link</span>
                        </div>
                        <span
                            class="px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 text-[10px] font-medium border border-emerald-500/20">Active</span>
                    </div>

                    <p
                        class="text-xs text-slate-400 font-mono truncate bg-black/30 p-2.5 rounded-xl border border-white/5 my-2">
                        meet.cloudnews.cn/room/cn-8924
                    </p>

                    <div class="flex gap-2 mt-3">
                        <button
                            class="flex-1 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-slate-200 text-xs font-semibold flex items-center justify-center gap-1.5 transition">
                            <i data-lucide="copy" class="w-3.5 h-3.5 text-sky-400"></i>
                            <span class="txt-copy-link">Copy Link</span>
                        </button>
                        <button
                            class="flex-1 py-2 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-500/30 text-xs font-semibold flex items-center justify-center gap-1.5 transition">
                            <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
                            <span class="txt-invite-share">Invite</span>
                        </button>
                    </div>
                </div>

                <!-- Quick Meeting Code Input (Webex direct join bar) -->
                <div class="p-3.5 rounded-2xl bg-white/[0.03] border border-white/5 flex items-center gap-2">
                    <i data-lucide="hash" class="w-4 h-4 text-slate-500 ml-1"></i>
                    <input type="text" placeholder="Enter Meeting Number / URL"
                        class="txt-quick-input bg-transparent text-xs text-white placeholder-slate-500 focus:outline-none flex-1">
                    <button
                        class="px-3 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-white font-semibold text-xs transition">
                        <span class="txt-go">Go</span>
                    </button>
                </div>

            </div>

            <!-- Bottom Glassmorphic Navigation Bar -->
            <div class="relative z-10 pt-2 border-t border-white/10 flex justify-around items-center text-slate-400">
                <button class="flex flex-col items-center gap-1 text-sky-400">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i>
                    <span class="text-[10px] font-semibold txt-nav-home">Home</span>
                </button>
                <button class="flex flex-col items-center gap-1 hover:text-slate-200 transition">
                    <i data-lucide="message-square" class="w-5 h-5"></i>
                    <span class="text-[10px] font-medium txt-nav-chat">Messages</span>
                </button>
                <button class="flex flex-col items-center gap-1 hover:text-slate-200 transition">
                    <i data-lucide="calendar" class="w-5 h-5"></i>
                    <span class="text-[10px] font-medium txt-nav-schedule">Schedule</span>
                </button>
            </div>

        </div>

    </div>

    <!-- Lucide Icon Renderer & Dynamic Language Switch Script -->
    <script>
        lucide.createIcons();

        const i18n = {
            en: {
                appTitle: "Cloud News",
                appTagline: "Frictionless, secure video meetings without boundaries.",
                joinBtn: "Join a Meeting",
                signInBtn: "Sign In",
                noAccount: "No account required to join standard meetings.",
                signInTitle: "Sign In to Cloud News",
                username: "Username / ID",
                password: "Password",
                submit: "Continue",
                welcome: "Personal Workspace",
                startMeeting: "Start Meeting",
                instantSub: "Instant Room",
                joinMeeting: "Join Meeting",
                enterId: "Via Link or ID",
                personalRoom: "Personal Meeting Link",
                copyLink: "Copy Link",
                invite: "Invite",
                quickInput: "Enter Meeting Number / URL",
                go: "Go",
                navHome: "Home",
                navChat: "Messages",
                navSchedule: "Schedule"
            },
            zh: {
                appTitle: "云讯",
                appTagline: "无缝、安全、零门槛的实时云会议体验。",
                joinBtn: "加入会议",
                signInBtn: "登录账号",
                noAccount: "加入标准会议无需预先注册账号。",
                signInTitle: "登录云讯",
                username: "用户名 / 账号",
                password: "密码",
                submit: "继续",
                welcome: "个人工作区",
                startMeeting: "发起会议",
                instantSub: "快速创建",
                joinMeeting: "加入会议",
                enterId: "输入号或链接",
                personalRoom: "个人专属会议链接",
                copyLink: "复制链接",
                invite: "邀请成员",
                quickInput: "输入会议号或加入链接",
                go: "进入",
                navHome: "首页",
                navChat: "消息",
                navSchedule: "日程"
            }
        };

        function switchLang(lang) {
            const data = i18n[lang];

            // Titles & General text
            document.querySelectorAll('.app-title').forEach(el => el.innerText = data.appTitle);
            document.querySelector('.app-tagline').innerText = data.appTagline;
            document.querySelector('.txt-join-btn').innerText = data.joinBtn;
            document.querySelector('.txt-signin-btn').innerText = data.signInBtn;
            document.querySelector('.txt-no-account').innerText = data.noAccount;
            document.querySelector('.txt-signin-title').innerText = data.signInTitle;
            document.querySelector('.txt-username-label').innerText = data.username;
            document.querySelector('.txt-password-label').innerText = data.password;
            document.querySelector('.txt-submit-btn').innerText = data.submit;

            // Home Screen text
            document.querySelector('.txt-welcome').innerText = data.welcome;
            document.querySelector('.txt-start-meeting').innerText = data.startMeeting;
            document.querySelector('.txt-instant-sub').innerText = data.instantSub;
            document.querySelector('.txt-join-meeting').innerText = data.joinMeeting;
            document.querySelector('.txt-enter-id').innerText = data.enterId;
            document.querySelector('.txt-personal-room').innerText = data.personalRoom;
            document.querySelector('.txt-copy-link').innerText = data.copyLink;
            document.querySelector('.txt-invite-share').innerText = data.invite;
            document.querySelector('.txt-quick-input').placeholder = data.quickInput;
            document.querySelector('.txt-go').innerText = data.go;
            document.querySelector('.txt-nav-home').innerText = data.navHome;
            document.querySelector('.txt-nav-chat').innerText = data.navChat;
            document.querySelector('.txt-nav-schedule').innerText = data.navSchedule;

            // Header button styling update
            if (lang === 'en') {
                document.getElementById('btn-en').className = "px-3 py-1 rounded-full text-xs font-semibold bg-sky-500 text-white transition";
                document.getElementById('btn-zh').className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition";
                document.querySelectorAll('.lang-btn-en').forEach(el => el.className = "lang-btn-en px-2.5 py-0.5 rounded-full font-medium transition bg-sky-500 text-white");
                document.querySelectorAll('.lang-btn-zh').forEach(el => el.className = "lang-btn-zh px-2.5 py-0.5 rounded-full font-medium text-slate-300 transition");
            } else {
                document.getElementById('btn-zh').className = "px-3 py-1 rounded-full text-xs font-semibold bg-sky-500 text-white transition";
                document.getElementById('btn-en').className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition";
                document.querySelectorAll('.lang-btn-zh').forEach(el => el.className = "lang-btn-zh px-2.5 py-0.5 rounded-full font-medium transition bg-sky-500 text-white");
                document.querySelectorAll('.lang-btn-en').forEach(el => el.className = "lang-btn-en px-2.5 py-0.5 rounded-full font-medium text-slate-300 transition");
            }
        }

        function toggleSignInModal(show) {
            const modal = document.getElementById('signin-modal');
            if (show) {
                modal.classList.remove('translate-y-full');
            } else {
                modal.classList.add('translate-y-full');
            }
        }
    </script>
</body>

</html>
